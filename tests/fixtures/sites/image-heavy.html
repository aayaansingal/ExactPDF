<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.6 Georgia,
          'Times New Roman',
          serif;
        color: #16181d;
        background: #fff;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 22px;
        margin: 32px 0 12px;
      }
      p {
        margin: 0 0 16px;
      }
      code,
      pre {
        font-family: ui-monospace, Menlo, monospace;
      }
      pre {
        background: #f4f5f7;
        padding: 14px;
        overflow-x: auto;
        border-radius: 6px;
        font-size: 13px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        border: 1px solid #d7dae0;
        padding: 7px 10px;
        text-align: left;
      }
      th {
        background: #f4f5f7;
      }
      .box {
        width: 100%;
        height: 180px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border-radius: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 12px;
        color: #64748b;
        text-align: center;
        margin-top: 4px;
      }
      .tile {
        height: 130px;
        border-radius: 6px;
      }
      .tile--0 {
        background: #2563eb;
      }
      .tile--1 {
        background: #7c3aed;
      }
      .tile--2 {
        background: #0891b2;
      }
      .tile--3 {
        background: #ca8a04;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>A Gallery</h1>
      <p>Every tile is an inline data URI, so the fixture never touches the network.</p>
      <div class="grid">
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 1</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 2</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 3</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 4</figcaption>
        </figure>
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 5</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 6</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 7</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 8</figcaption>
        </figure>
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 9</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 10</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 11</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 12</figcaption>
        </figure>
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 13</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 14</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 15</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 16</figcaption>
        </figure>
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 17</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 18</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 19</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 20</figcaption>
        </figure>
        <figure>
          <div class="tile tile--0"></div>
          <figcaption>Tile 21</figcaption>
        </figure>
        <figure>
          <div class="tile tile--1"></div>
          <figcaption>Tile 22</figcaption>
        </figure>
        <figure>
          <div class="tile tile--2"></div>
          <figcaption>Tile 23</figcaption>
        </figure>
        <figure>
          <div class="tile tile--3"></div>
          <figcaption>Tile 24</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
